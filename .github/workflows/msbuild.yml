name: MSBuild

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .\Sources\OpenKey\win32\OpenKey

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Verify Sciter SDK Files
      shell: powershell
      run: |
        Write-Host "Verifying Sciter SDK files in repository..."
        $windowsPath = "${{ github.workspace }}\windows"
        $x64Path = "$windowsPath\x64"
        
        # packfolder.exe is in windows/ root, sciter.dll is in windows/x64/
        $packfolder = Get-Item "$windowsPath\packfolder.exe" -ErrorAction SilentlyContinue
        $sciterDll = Get-Item "$x64Path\sciter.dll" -ErrorAction SilentlyContinue
        
        if (-not $packfolder -or $packfolder.Length -lt 100000) {
          Write-Error "packfolder.exe missing or invalid in $windowsPath"
          exit 1
        }
        if (-not $sciterDll -or $sciterDll.Length -lt 1000000) {
          Write-Error "sciter.dll missing or invalid in $x64Path"
          exit 1
        }
        
        Write-Host "Sciter SDK files verified:"
        Write-Host "  $windowsPath\packfolder.exe: $($packfolder.Length) bytes"
        Write-Host "  $x64Path\sciter.dll: $($sciterDll.Length) bytes"

    - name: Generate Sciter Resources
      shell: powershell
      run: |
        Write-Host "Generating Sciter resources with packfolder..."
        $packfolder = "${{ github.workspace }}\windows\packfolder.exe"
        $sciterDir = "${{ github.workspace }}\Resources\Sciter"
        $outputFile = "$sciterDir\resources.cpp"
        
        # Run packfolder to generate resources.cpp
        & $packfolder $sciterDir $outputFile -v "resources"
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "packfolder.exe failed with exit code $LASTEXITCODE"
          exit 1
        }
        
        if (Test-Path $outputFile) {
          $size = (Get-Item $outputFile).Length
          Write-Host "Generated $outputFile ($size bytes)"
        } else {
          Write-Error "resources.cpp was not generated"
          exit 1
        }

    - name: Build x86
      run: msbuild -m -target:Rebuild -p:Configuration=Release -p:Platform=x86 ${{env.SOLUTION_FILE_PATH}}

    - name: Build x64
      run: msbuild -m -target:Rebuild -p:Configuration=Release -p:Platform=x64 ${{env.SOLUTION_FILE_PATH}}

    - name: Copy Sciter DLL to Release folders
      shell: powershell
      run: |
        # Copy sciter.dll to release folders (no longer embedded in EXE)
        $x64Dll = "${{ github.workspace }}\windows\x64\sciter.dll"
        $x86Dll = "${{ github.workspace }}\windows\x32\sciter.dll"
        
        Copy-Item $x64Dll "${{env.SOLUTION_FILE_PATH}}\x64\Release\sciter.dll" -Force
        
        # For x86, use x32 folder if exists, otherwise fall back to x64
        if (Test-Path $x86Dll) {
          Copy-Item $x86Dll "${{env.SOLUTION_FILE_PATH}}\Release\sciter.dll" -Force
        } else {
          Write-Host "x32 sciter.dll not found, using x64 version for x86 build"
          Copy-Item $x64Dll "${{env.SOLUTION_FILE_PATH}}\Release\sciter.dll" -Force
        }
        
        Write-Host "Sciter DLL copied to release folders"

    - name: Zip Release
      if: startsWith(github.ref, 'refs/tags/')
      shell: powershell
      run: |
        # Exclude .pdb debug files from release zip to keep size small
        # Note: GenerateDebugInformation=true in vcxproj is enough for Windows Defender trust
        Get-ChildItem "${{env.SOLUTION_FILE_PATH}}/x64/Release/*" -Exclude *.pdb | Compress-Archive -DestinationPath NextKey-x64.zip
        Get-ChildItem "${{env.SOLUTION_FILE_PATH}}/Release/*" -Exclude *.pdb | Compress-Archive -DestinationPath NextKey-x86.zip

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        body_path: RELEASE_NOTES.md
        files: |
          NextKey-x64.zip
          NextKey-x86.zip

    - name: Upload a Build Artifact
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: NextKey
        path: |
          ${{env.SOLUTION_FILE_PATH}}/Release/
          ${{env.SOLUTION_FILE_PATH}}/x64/Release/

    outputs:
      subject-name: NextKey
      subject-digest: ${{steps.upload.outputs.artifact-digest}}

  attest:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@v2
      with:
        subject-name: ${{needs.build.outputs.subject-name}}
        subject-digest: sha256:${{needs.build.outputs.subject-digest}}